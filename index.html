<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    overflow-x: hidden;
  }

  /* ===== 标题栏 ===== */
  .header {
    text-align: center;
    padding: 16px 16px 8px;
    width: 100%;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: #ccc; }

  /* ===== 容器（居中手机框） ===== */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    min-height: calc(100vh - 60px);
  }

  /* ===== 手机模拟器 ===== */
  .phone-wrap { position: relative; }
  .phone-frame {

  /* ===== 手机模拟器 ===== */
  .phone-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    border-radius: 44px;
    border: 6px solid #2a2a3e;
    background: #000;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #3a3a5e, 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ===== 屏幕层 ===== */
  .screen {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 1;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }
  .screen img {
    width: 100%;
    height: 100%;

  /* ===== 热区（默认半透明，hover 高亮） ===== */
  .hotspot {
    position: absolute;
    z-index: 20;
    cursor: pointer;
    border: 2px solid rgba(0, 212, 255, 0.25);
    border-radius: 6px;
    transition: all 0.2s ease;
    background: rgba(0, 212, 255, 0.06);
  }
  .hotspot:hover {
    border-color: #00d4ff;
    background: rgba(0, 212, 255, 0.15);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  .hotspot:active {
    background: rgba(0, 212, 255, 0.25);
  }

  /* 热区标签（hover 时显示） */
  .hotspot::after {
    content: attr(data-label);
    position: absolute;
    bottom: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.88);
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 30;
  }
  .hotspot:hover::after { opacity: 1; }

  .hotspot:hover::after { opacity: 1; }

  /* ===== 响应式 - 手机全屏 ===== */
  @media (max-width: 500px) {
    body { background: #000; }
    .header { display: none; }
    .container { padding: 0; min-height: 100vh; }
    .phone-frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .screen img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  }
</head>

let currentScreen = 'screen-xj1';

function buildHotspots() {
  HOTSPOT_CONFIG.forEach(cfg => {
    const screen = document.getElementById(cfg.screen);
    if (!screen) return;
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.dataset.label = cfg.label;
    el.dataset.target = cfg.target;
    const s = cfg.pos;
    el.style.cssText =
      (s.left   ? 'left:'   + s.left   + ';' : '') +
      (s.right  ? 'right:'  + s.right  + ';' : '') +
      (s.top    ? 'top:'    + s.top    + ';' : '') +
      (s.bottom ? 'bottom:' + s.bottom + ';' : '') +
      'width:'  + s.width  + ';' +
      'height:' + s.height + ';';
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (cfg.target) navigateTo(cfg.target);
    });
    screen.appendChild(el);
  });
}

function navigateTo(screenId) {
  if (screenId === currentScreen) return;
  document.getElementById(currentScreen)?.classList.remove('active');
  document.getElementById(screenId)?.classList.add('active');
  currentScreen = screenId;
}
function init() {
  buildHotspots();
}
