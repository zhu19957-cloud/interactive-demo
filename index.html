<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>互动流程 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#1a1a2e;font-family:-apple-system,'PingFang SC',sans-serif;display:flex;flex-direction:column;align-items:center;color:#fff}
.header{text-align:center;padding:14px 16px 6px;flex-shrink:0}
.header h1{font-size:16px;font-weight:600;color:#ccc}
.container{flex:1;display:flex;align-items:center;justify-content:center;padding:10px}
.phone-frame{
  --h:min(90vh,812px);
  width:calc(var(--h)*375/812);height:var(--h);
  border-radius:44px;border:6px solid #2a2a3e;background:#000;
  overflow:hidden;position:relative;
  box-shadow:0 0 0 2px #3a3a5e,0 20px 60px rgba(0,0,0,0.5);
}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:1}
.screen.active{opacity:1;pointer-events:auto;z-index:10}
.screen img{width:100%;height:100%;display:block}
.hotspot{position:absolute;z-index:20;cursor:pointer;border:2px solid rgba(0,212,255,.25);border-radius:6px;transition:all .2s ease;background:rgba(0,212,255,.06)}
.hotspot:hover{border-color:#00d4ff;background:rgba(0,212,255,.15);box-shadow:0 0 20px rgba(0,212,255,.3)}
.hotspot::after{content:attr(data-label);position:absolute;bottom:calc(100%+5px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;font-size:11px;padding:4px 10px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.hotspot:hover::after{opacity:1}
@media(max-width:600px){
  body{background:#000}.header{display:none}.container{padding:0}
  .phone-frame{--h:100dvh;width:100vw;height:100dvh;border-radius:0;border:none;box-shadow:none}
  .screen img{object-fit:contain}
}
</style>
</head>
<body>

<div class="header"><h1>互动流程 Demo</h1></div>

<div class="container">
<div class="phone-frame" id="phoneFrame">

<div class="screen active" id="screen-xj1"><img src="sucai/选角1.png" alt="选角1"></div>
<div class="screen" id="screen-xj2"><img src="sucai/选角2.png" alt="选角2"></div>
<div class="screen" id="screen-xj3"><img src="sucai/选角3.png" alt="选角3"></div>
<div class="screen" id="screen-xj4"><img src="sucai/选角4.png" alt="选角4"></div>
<div class="screen" id="screen-lt1"><img src="sucai/聊天1.png" alt="聊天1"></div>
<div class="screen" id="screen-lt2"><img src="sucai/聊天2.png" alt="聊天2"></div>
<div class="screen" id="screen-th1"><img src="sucai/通话1.png" alt="通话1"></div>
<div class="screen" id="screen-th2"><img src="sucai/通话2.png" alt="通话2"></div>
<div class="screen" id="screen-mtr1"><img src="sucai/木头人1.png" alt="木头人1"></div>
<div class="screen" id="screen-mtr2"><img src="sucai/木头人2.png" alt="木头人2"></div>
<div class="screen" id="screen-cf1"><img src="sucai/惩罚1.png" alt="惩罚1"></div>
<div class="screen" id="screen-cf2"><img src="sucai/惩罚2.png" alt="惩罚2"></div>
<div class="screen" id="screen-hs1"><img src="sucai/哄睡1.png" alt="哄睡1"></div>
<div class="screen" id="screen-fj1"><img src="sucai/房间1.png" alt="房间1"></div>
<div class="screen" id="screen-rj1"><img src="sucai/日记1.png" alt="日记1"></div>
<div class="screen" id="screen-sq1"><img src="sucai/收起1.png" alt="收起1"></div>
<div class="screen" id="screen-sq2"><img src="sucai/收起2.png" alt="收起2"></div>

</div>
</div>

<script>
const CFG=[
  {s:'screen-xj1',l:'选Ta',t:'screen-xj2',p:{l:4,b:6,w:92,h:7}},
  {s:'screen-xj2',l:'← 返回选角1',t:'screen-xj1',p:{l:4,t:8,w:10,h:5}},
  {s:'screen-xj2',l:'继续 → 选角3',t:'screen-xj3',p:{l:4,b:38,w:92,h:7}},
  {s:'screen-xj3',l:'← 返回选角2',t:'screen-xj2',p:{l:4,t:8,w:10,h:5}},
  {s:'screen-xj3',l:'继续 → 选角4',t:'screen-xj4',p:{l:4,b:6,w:92,h:7}},
  {s:'screen-xj4',l:'← 返回选角3',t:'screen-xj3',p:{l:4,t:8,w:10,h:5}},
  {s:'screen-xj4',l:'进入聊天 → 聊天1',t:'screen-lt1',p:{l:4,b:6,w:92,h:7}},
  {s:'screen-lt1',l:'📞 电话 → 通话1',t:'screen-th1',p:{l:5,b:6.5,w:9,h:5}},
  {s:'screen-lt1',l:'➕ 更多功能 → 聊天2',t:'screen-lt2',p:{r:5.5,b:6.5,w:9,h:5}},
  {s:'screen-lt2',l:'📞 电话 → 通话1',t:'screen-th1',p:{l:5,b:17.5,w:9,h:5}},
  {s:'screen-lt2',l:'😴 哄睡 → 哄睡1',t:'screen-hs1',p:{r:30,b:6.5,w:16,h:8}},
  {s:'screen-lt2',l:'🪵 木头人 → 木头人1',t:'screen-mtr1',p:{r:6,b:6.5,w:16,h:8}},
  {s:'screen-th1',l:'🖼 小窗 → 通话2',t:'screen-th2',p:{r:2.5,t:7.5,w:12,h:5}},
  {s:'screen-th1',l:'🔴 挂断 → 聊天1',t:'screen-lt1',p:{r:5.5,b:6.5,w:16,h:7}},
  {s:'screen-th2',l:'👤 头像 → 通话1',t:'screen-th1',p:{l:75,t:16,w:26,h:16}},
  {s:'screen-th2',l:'💬 更多 → 聊天2',t:'screen-lt2',p:{r:5.5,b:6.5,w:9,h:5}},
  {s:'screen-mtr1',l:'✕ 关闭游戏 → 聊天1',t:'screen-lt1',p:{r:6.5,t:49,w:7,h:3.5}},
  {s:'screen-mtr1',l:'🃏 找到木头人 → 木头人2',t:'screen-mtr2',p:{l:40.5,t:53,w:19,h:12}},
  {s:'screen-mtr2',l:'🎭 木偶 → 惩罚1',t:'screen-cf1',p:{l:24,t:78,w:52,h:9}},
  {s:'screen-cf1',l:'▶️ 播放视频 → 惩罚2',t:'screen-cf2',p:{l:2,b:20,w:30,h:18}},
  {s:'screen-cf1',l:'💬 打开聊天2',t:'screen-lt2',p:{r:5.5,b:6.5,w:9,h:5}},
  {s:'screen-cf1',l:'📞 打开通话1',t:'screen-th1',p:{l:5,b:6.5,w:9,h:5}},
  {s:'screen-cf2',l:'✕ 关闭 → 聊天1',t:'screen-lt1',p:{r:2.8,t:7.8,w:11,h:5}},
  {s:'screen-hs1',l:'✕ 关闭音乐 → 聊天1',t:'screen-lt1',p:{r:6,b:18,w:8,h:4}},
  {s:'screen-lt1',l:'🏠 房间',t:'screen-fj1',p:{r:2,t:7,w:12,h:6}},
  {s:'screen-fj1',l:'← 返回聊天1',t:'screen-lt1',p:{l:4,t:8,w:11,h:6}},
  {s:'screen-fj1',l:'📖 打开日记1',t:'screen-rj1',p:{l:25,t:44,w:30,h:10}},
  {s:'screen-rj1',l:'← 返回房间1',t:'screen-fj1',p:{l:4,t:8,w:11,h:6}},
  {s:'screen-mtr1',l:'📦 收起',t:'screen-sq1',p:{r:16,t:49,w:7,h:3.5}},
  {s:'screen-sq1',l:'← 返回木头人1',t:'screen-mtr1',p:{l:86,t:80,w:16,h:6}},
  {s:'screen-hs1',l:'🗂️ 收起',t:'screen-sq2',p:{r:16,b:18,w:8,h:4}},
  {s:'screen-sq2',l:'← 返回哄睡1',t:'screen-hs1',p:{l:86,t:80,w:16,h:6}}
];

let cur='screen-xj1';
const pf=document.getElementById('phoneFrame');
const hotspots=[];

function px(v,dim){return parseFloat(v)/100*dim+'px'}

function layout(){
  const W=pf.offsetWidth,H=pf.offsetHeight;
  hotspots.forEach(h=>{
    const p=h.p,a=[];
    if(p.l!=null)a.push('left:'+px(p.l,W));
    if(p.r!=null)a.push('right:'+px(p.r,W));
    if(p.t!=null)a.push('top:'+px(p.t,H));
    if(p.b!=null)a.push('bottom:'+px(p.b,H));
    a.push('width:'+px(p.w,W),'height:'+px(p.h,H));
    h.el.style.cssText=a.join(';');
  });

CFG.forEach(c=>{
  const sc=document.getElementById(c.s);
  if(!sc)return;
  const d=document.createElement('div');
  d.className='hotspot';d.dataset.label=c.l;
  hotspots.push({el:d,p:c.p});
  d.onclick=()=>{if(c.t){document.getElementById(cur).classList.remove('active');document.getElementById(c.t).classList.add('active');cur=c.t}};
  sc.appendChild(d);
});

layout();
window.addEventListener('resize',layout);
</script>

</body>
</html>
