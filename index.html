<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动流程 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    overflow-x: hidden;
  }

  /* ===== 标题栏 ===== */
  .header {
    text-align: center;
    padding: 20px 16px 10px;
    width: 100%;
    max-width: 1200px;
  }
  .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #8888aa; }

  /* ===== 主体布局 ===== */
  .main-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
    max-width: 1200px;
    width: 100%;
    flex-wrap: wrap;
  }

  /* ===== 手机模拟器 ===== */
  .phone-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    border-radius: 44px;
    border: 6px solid #2a2a3e;
    background: #000;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #3a3a5e, 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ===== 屏幕层 ===== */
  .screen {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 1;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }
  .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* 占位界面样式（新界面无截图） */
  .placeholder-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.8);
  }


  /* ===== 热区（默认半透明，hover 高亮） ===== */
  .hotspot {
    position: absolute;
    z-index: 20;
    cursor: pointer;
    border: 2px solid rgba(0, 212, 255, 0.25);
    border-radius: 6px;
    transition: all 0.2s ease;
    background: rgba(0, 212, 255, 0.06);
  }
  .hotspot:hover {
    border-color: #00d4ff;
    background: rgba(0, 212, 255, 0.15);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  .hotspot:active {
    background: rgba(0, 212, 255, 0.25);
  }

  /* 热区标签（hover 时显示） */
  .hotspot::after {
    content: attr(data-label);
    position: absolute;
    bottom: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.88);
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 30;
  }
  .hotspot:hover::after { opacity: 1; }


  /* ===== 右侧面板 ===== */
  .side-panel {
    flex: 1;
    min-width: 320px;
    max-width: 500px;
  }

  /* 面包屑导航 */
  .breadcrumb {
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    min-height: 44px;
  }
  .breadcrumb span { color: #8888aa; }
  .breadcrumb .current {
    color: #ffd700;
    font-weight: 600;
  }
  .breadcrumb .sep { color: #555; }

  /* 流程图 */
  .flow-card {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .flow-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #ccc;
  }

  /* 节点网格 */
  .node-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .node-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 12px;
    color: #aaa;
  }
  .node-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }
  .node-btn.active {
    background: rgba(255, 200, 50, 0.15);
    border-color: rgba(255, 200, 50, 0.5);
    color: #ffd700;
    font-weight: 600;
  }

  /* 当前屏幕信息 */
  .screen-info {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 16px;
  }
  .screen-info h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #ccc;
  }
  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
    color: #999;
  }
  .info-row .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-green { background: #4ade80; }
  .dot-blue { background: #60a5fa; }
  .dot-orange { background: #fb923c; }
  .dot-red { background: #f87171; }
  .dot-purple { background: #c084fc; }
  .dot-yellow { background: #facc15; }

  /* ===== 流程图区域 ===== */
  .flow-section {
    width: 100%;
    max-width: 1200px;
    padding: 0 16px 30px;
  }
  .mermaid-box {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 20px;
    overflow-x: auto;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 860px) {
    .main-layout { flex-direction: column; align-items: center; }
    .side-panel { min-width: 0; width: 100%; max-width: 375px; }
    .phone-frame { transform: scale(0.85); transform-origin: top center; }
  }

  /* SVG 流程图 */
  .svg-flow { width: 100%; }
  .svg-flow text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
</style>
</head>
<body>

<div class="header">
  <h1>🎮 互动流程 Demo</h1>
  <p>鼠标悬停在界面上可发现 <span style="color:#ffd700">可交互热区</span> · 右侧面板可直接导航</p>
</div>

<div class="main-layout">
  <!-- ===== 手机模拟器 ===== -->
  <div class="phone-wrap">
    <div class="phone-frame" id="phoneFrame">

      <!-- 界面由 JS 动态生成热区，此处只放截图 -->
      <!-- 选角1 --><div class="screen active" id="screen-xj1" data-name="选角1" data-phase="选角"><img src="sucai/选角1.png" alt="选角1"></div>
      <!-- 选角2 --><div class="screen" id="screen-xj2" data-name="选角2" data-phase="选角"><img src="sucai/选角2.png" alt="选角2"></div>
      <!-- 选角3 --><div class="screen" id="screen-xj3" data-name="选角3" data-phase="选角"><img src="sucai/选角3.png" alt="选角3"></div>
      <!-- 选角4 --><div class="screen" id="screen-xj4" data-name="选角4" data-phase="选角"><img src="sucai/选角4.png" alt="选角4"></div>
      <!-- 聊天1 --><div class="screen" id="screen-lt1" data-name="聊天1" data-phase="聊天"><img src="sucai/聊天1.png" alt="聊天1"></div>
      <!-- 聊天2 --><div class="screen" id="screen-lt2" data-name="聊天2" data-phase="聊天"><img src="sucai/聊天2.png" alt="聊天2"></div>
      <!-- 通话1 --><div class="screen" id="screen-th1" data-name="通话1" data-phase="通话"><img src="sucai/通话1.png" alt="通话1"></div>
      <!-- 通话2 --><div class="screen" id="screen-th2" data-name="通话2" data-phase="通话"><img src="sucai/通话2.png" alt="通话2"></div>
      <!-- 木头人1 --><div class="screen" id="screen-mtr1" data-name="木头人1" data-phase="木头人"><img src="sucai/木头人1.png" alt="木头人1"></div>
      <!-- 木头人2 --><div class="screen" id="screen-mtr2" data-name="木头人2" data-phase="木头人"><img src="sucai/木头人2.png" alt="木头人2"></div>
      <!-- 惩罚1 --><div class="screen" id="screen-cf1" data-name="惩罚1" data-phase="惩罚"><img src="sucai/惩罚1.png" alt="惩罚1"></div>
      <!-- 惩罚2 --><div class="screen" id="screen-cf2" data-name="惩罚2" data-phase="惩罚"><img src="sucai/惩罚2.png" alt="惩罚2"></div>
      <!-- 哄睡1 --><div class="screen" id="screen-hs1" data-name="哄睡1" data-phase="哄睡"><img src="sucai/哄睡1.png" alt="哄睡1"></div>
      <!-- 房间1（新） --><div class="screen" id="screen-fj1" data-name="房间1" data-phase="房间"><img src="sucai/房间1.png" alt="房间1"></div>
      <!-- 日记1（新） --><div class="screen" id="screen-rj1" data-name="日记1" data-phase="日记"><img src="sucai/日记1.png" alt="日记1"></div>
      <!-- 收起1（新） --><div class="screen" id="screen-sq1" data-name="收起1" data-phase="收起"><img src="sucai/收起1.png" alt="收起1"></div>
      <!-- 收起2（新） --><div class="screen" id="screen-sq2" data-name="收起2" data-phase="收起"><img src="sucai/收起2.png" alt="收起2"></div>


      </div>


    </div><!-- /phone-frame -->
  </div><!-- /phone-wrap -->

  <!-- ===== 右侧面板 ===== -->
  <div class="side-panel">
    <!-- 面包屑 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="current">选角1</span>
    </div>

    <!-- 导航节点 -->
    <div class="flow-card">
      <h3>📍 全局导航</h3>
      <div class="node-grid" id="nodeGrid"></div>
    </div>

    <!-- 当前信息 -->
    <div class="screen-info" id="screenInfo">
      <h3>ℹ️ 当前界面</h3>
      <div id="infoContent"></div>
    </div>

    <!-- 跳转说明 -->
    <div class="flow-card" style="margin-top:16px;">
      <h3>🔗 跳转关系</h3>
      <div style="font-size:12px;color:#888;line-height:1.8;" id="relationText"></div>
    </div>
  </div>
</div>

<!-- ===== SVG 流程图 ===== -->
<div class="flow-section">
  <div class="mermaid-box">
    <h3 style="font-size:14px;font-weight:600;margin-bottom:16px;color:#ccc;">📊 完整流程图</h3>
    <svg class="svg-flow" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <!-- 背景 -->
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
        </marker>
        <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd700"/>
        </marker>
        <linearGradient id="gSelect" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gChat" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#22c55e" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gCall" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gGame" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gPunish" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gSleep" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
        </linearGradient>
      </defs>

      <!-- 分区背景 -->
      <rect x="10" y="10" width="280" height="110" rx="12" fill="url(#gSelect)" stroke="#6366f1" stroke-opacity="0.3"/>
      <text x="20" y="30" fill="#6366f1" font-size="11" font-weight="600">选角流程</text>

      <rect x="310" y="10" width="180" height="240" rx="12" fill="url(#gChat)" stroke="#22c55e" stroke-opacity="0.3"/>
      <text x="320" y="30" fill="#22c55e" font-size="11" font-weight="600">聊天</text>

      <rect x="510" y="10" width="180" height="150" rx="12" fill="url(#gCall)" stroke="#3b82f6" stroke-opacity="0.3"/>
      <text x="520" y="30" fill="#3b82f6" font-size="11" font-weight="600">通话</text>

      <rect x="510" y="180" width="180" height="170" rx="12" fill="url(#gSleep)" stroke="#a855f7" stroke-opacity="0.3"/>
      <text x="520" y="200" fill="#a855f7" font-size="11" font-weight="600">哄睡</text>

      <rect x="310" y="270" width="180" height="110" rx="12" fill="url(#gGame)" stroke="#f59e0b" stroke-opacity="0.3"/>
      <text x="320" y="290" fill="#f59e0b" font-size="11" font-weight="600">木头人</text>

      <rect x="310" y="400" width="180" height="110" rx="12" fill="url(#gPunish)" stroke="#ef4444" stroke-opacity="0.3"/>
      <text x="320" y="420" fill="#ef4444" font-size="11" font-weight="600">惩罚</text>

      <!-- 选角节点 -->
      <rect x="30" y="45" width="55" height="30" rx="6" fill="#1e1e3a" stroke="#6366f1"/>
      <text x="57" y="65" fill="#c4b5fd" font-size="10" text-anchor="middle">选角1</text>

      <rect x="100" y="45" width="55" height="30" rx="6" fill="#1e1e3a" stroke="#6366f1"/>
      <text x="127" y="65" fill="#c4b5fd" font-size="10" text-anchor="middle">选角2</text>

      <rect x="170" y="45" width="55" height="30" rx="6" fill="#1e1e3a" stroke="#6366f1"/>
      <text x="197" y="65" fill="#c4b5fd" font-size="10" text-anchor="middle">选角3</text>

      <rect x="100" y="85" width="55" height="30" rx="6" fill="#1e1e3a" stroke="#6366f1"/>
      <text x="127" y="105" fill="#c4b5fd" font-size="10" text-anchor="middle">选角4</text>

      <!-- 选角箭头 -->
      <line x1="85" y1="60" x2="100" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="155" y1="60" x2="170" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="197" y1="75" x2="197" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="155" y1="100" x2="230" y2="100" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow-gold)"/>

      <!-- 聊天节点 -->
      <rect x="340" y="45" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#22c55e"/>
      <text x="370" y="65" fill="#86efac" font-size="10" text-anchor="middle">聊天1</text>

      <rect x="340" y="110" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#22c55e"/>
      <text x="370" y="130" fill="#86efac" font-size="10" text-anchor="middle">聊天2</text>

      <!-- 聊天箭头 -->
      <line x1="370" y1="75" x2="370" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="378" y="95" fill="#666" font-size="8">下拉</text>


      <!-- 聊天1 → 聊天2（+号）-->
      <path d="M 400 70 Q 430 90 400 115" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="418" y="90" fill="#22c55e" font-size="8">➕更多</text>

      <!-- 选角4 → 聊天1 -->
      <path d="M 155 100 Q 260 100 340 60" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow-gold)"/>
      <text x="240" y="80" fill="#ffd700" font-size="8">进入聊天</text>

      <!-- 聊天 → 通话 -->
      <rect x="540" y="45" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#3b82f6"/>
      <text x="570" y="65" fill="#93c5fd" font-size="10" text-anchor="middle">通话1</text>

      <rect x="540" y="100" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#3b82f6"/>
      <text x="570" y="120" fill="#93c5fd" font-size="10" text-anchor="middle">通话2</text>

      <line x1="400" y1="60" x2="540" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="460" y="55" fill="#666" font-size="8">📞拨打</text>

      <!-- 通话1 → 通话2（右上小窗）-->
      <line x1="570" y1="75" x2="570" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="578" y="88" fill="#666" font-size="8">🖼小窗</text>

      <!-- 通话1 → 聊天1（挂断）-->
      <path d="M 540 70 Q 480 60 400 60" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
      <text x="470" y="68" fill="#f87171" font-size="8">🔴挂断</text>

      <!-- 通话2 → 通话1（头像）-->
      <path d="M 540 110 Q 520 80 540 65" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="525" y="82" fill="#60a5fa" font-size="8">👤头像</text>

      <!-- 通话2 → 聊天2（右下角）-->
      <path d="M 540 125 Q 480 130 400 125" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="465" y="138" fill="#22c55e" font-size="8">💬聊天2</text>

      <!-- 聊天 → 哄睡 -->
      <rect x="540" y="210" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#a855f7"/>
      <text x="570" y="230" fill="#d8b4fe" font-size="10" text-anchor="middle">哄睡1</text>

      <line x1="400" y1="125" x2="540" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="460" y="175" fill="#666" font-size="8">😴哄睡</text>

      <!-- 哄睡 → 聊天1 返回 -->
      <path d="M 540 225 Q 470 180 400 75" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
      <text x="465" y="155" fill="#f87171" font-size="8">←返回</text>

      <!-- 聊天 → 木头人 -->
      <rect x="340" y="310" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#f59e0b"/>
      <text x="370" y="330" fill="#fcd34d" font-size="10" text-anchor="middle">木头人1</text>

      <rect x="340" y="370" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#f59e0b"/>
      <text x="370" y="390" fill="#fcd34d" font-size="10" text-anchor="middle">木头人2</text>

      <line x1="370" y1="140" x2="370" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="378" y="230" fill="#666" font-size="8">🪵木头人</text>

      <line x1="370" y1="340" x2="370" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="378" y="360" fill="#666" font-size="8">找到</text>

      <!-- 木头人 → 聊天1 返回 -->
      <path d="M 340 320 Q 300 200 340 75" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
      <text x="300" y="200" fill="#f87171" font-size="8">←返回</text>

      <!-- 木头人2 → 惩罚1 -->
      <rect x="340" y="440" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#ef4444"/>
      <text x="370" y="460" fill="#fca5a5" font-size="10" text-anchor="middle">惩罚1</text>

      <rect x="420" y="440" width="60" height="30" rx="6" fill="#1e1e3a" stroke="#ef4444"/>
      <text x="450" y="460" fill="#fca5a5" font-size="10" text-anchor="middle">惩罚2</text>

let currentScreen = localStorage.getItem('demo_last_screen') || 'screen-xj1';
let history = [currentScreen];

// 根据 HOTSPOT_CONFIG 动态生成所有热区 DOM
function buildHotspots() {
  HOTSPOT_CONFIG.forEach(cfg => {
    const screen = document.getElementById(cfg.screen);
    if (!screen) return;
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.dataset.label = cfg.label;
    el.dataset.target = cfg.target;
    // 把 pos 对象转成 style 字符串
    const s = cfg.pos;
    el.style.cssText =
      (s.left   ? 'left:'   + s.left   + ';' : '') +
      (s.right  ? 'right:'  + s.right  + ';' : '') +
      (s.top    ? 'top:'    + s.top    + ';' : '') +
      (s.bottom ? 'bottom:' + s.bottom + ';' : '') +
      'width:'  + s.width  + ';' +
      'height:' + s.height + ';';
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (cfg.target) navigateTo(cfg.target);
    });
    screen.appendChild(el);
  });
}

function init() {
  // 恢复上次浏览的页面
  const saved = localStorage.getItem('demo_last_screen');
  if (saved && document.getElementById(saved)) {
    currentScreen = saved;
    history = [saved];
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(saved).classList.add('active');
  }
  buildHotspots();
  buildNodeGrid();
  updateUI();
}

function navigateTo(screenId) {
  if (screenId === currentScreen) return;
  const cur = document.getElementById(currentScreen);
  if (cur) cur.classList.remove('active');
  const next = document.getElementById(screenId);
  if (next) next.classList.add('active');
  if (history[history.length - 1] !== screenId) {
    history.push(screenId);
    if (history.length > 20) history.shift();
  }
  currentScreen = screenId;
  localStorage.setItem('demo_last_screen', screenId);
  updateUI();
}

function updateUI() {
  const data = SCREENS[currentScreen];

  const bc = document.getElementById('breadcrumb');
  const c = PHASE_COLORS[data.phase] || '#888';
  bc.innerHTML = `<span style="color:${c}">${data.icon} ${data.phase}</span><span class="sep">›</span><span class="current">${data.name}</span>`;
  document.querySelectorAll('.node-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === currentScreen));
  // 信息面板：列出当前界面的所有热区
  const info = document.getElementById('infoContent');
  const hs = HOTSPOT_CONFIG.filter(h => h.screen === currentScreen);
  info.innerHTML = `<div class="info-row"><div class="dot" style="background:${c}"></div>${data.name} · ${data.phase}</div>` +
    `<div class="info-row" style="color:#bbb;font-size:12px;">${data.desc}</div>` +
    `<div style="margin-top:8px;">${hs.map(h => `<div class="info-row" style="font-size:12px;">→ ${h.label}</div>`).join('')}</div>`;
  // 跳转关系
  const rel = document.getElementById('relationText');
  const lines = hs.map(h => `${data.name} → <b>${SCREENS[h.target]?.name || h.target}</b>（${h.label}）`);
  rel.innerHTML = lines.join('<br>') || '无热区';
}

function buildNodeGrid() {
  const grid = document.getElementById('nodeGrid');
  ALL_SCREENS_ORDER.forEach(id => {
    const d = SCREENS[id];
    const btn = document.createElement('div');
    btn.className = 'node-btn';
    btn.dataset.screen = id;
    btn.textContent = `${d.icon} ${d.name}`;
    btn.addEventListener('click', () => navigateTo(id));
    grid.appendChild(btn);
  });
}

init();
</script>
